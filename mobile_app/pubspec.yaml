name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  home_widget: ^0.7.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.0
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.3
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/lumine_icon.png"
  adaptive_icon_background: "#050510"
  adaptive_icon_foreground: "assets/icon/lumine_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/animations/
    - assets/images/reflect_bg.png
    - assets/images/patterns_bg.png
    
